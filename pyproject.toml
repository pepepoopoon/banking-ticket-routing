[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "banking-ticket-routing"
version = "0.1.0"
description = "Калиброванная маршрутизация банковских обращений с abstention"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
banking-generate-smoke = "banking_ticket_routing.demo_data:main"
banking-train = "banking_ticket_routing.train:main"
banking-evaluate = "banking_ticket_routing.evaluate:main"
banking-predict = "banking_ticket_routing.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_ticket_routing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
